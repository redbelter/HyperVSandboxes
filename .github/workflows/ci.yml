name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Mocked tier: HYPERV_FAKE_PS=1 swaps in the in-process FakeRunner, so the
      # full REST/MCP/engine surface is exercised without Hyper-V being present.
      - name: xunit suite (fake PowerShell runner)
        env:
          HYPERV_FAKE_PS: "1"
        run: dotnet test tests/HermesHyperV.Tests -c Release --nologo -v q

      - name: dashboard JS syntax gate
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('src/HermesHyperV/wwwroot/dashboard.html','utf8');let i=0;for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)){fs.writeFileSync('dash'+(i++)+'.js',m[1]);}"
          node --check dash0.js

  smoke:
    # Live tier: boots the REAL published exe (Windows service host, HTTP/MCP/
    # dashboard wiring genuinely exercised) and runs tests/smoke.py against it.
    # GitHub-hosted runners have no usable Hyper-V role (only larger runners do,
    # actions/runner-images#9285), so the PowerShell layer is mocked via
    # HYPERV_FAKE_PS=1 while everything above it stays real. On a self-hosted
    # runner with the Hyper-V role + pre-baked media, drop the env var for the
    # full real path.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish
        run: dotnet publish src/HermesHyperV -c Release -r win-x64 --nologo -v q
      - name: run service + smoke suite
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse -Filter HermesHyperV.exe src/HermesHyperV/bin/Release | Select-Object -First 1).FullName
          $env:HYPERV_FAKE_PS = "1"
          $env:HYPERV_ROOT = Join-Path $env:TEMP "ci-hyperv"
          Start-Process -FilePath $exe -ArgumentList '--console' -WindowStyle Hidden -WorkingDirectory (Split-Path $exe)
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { Invoke-RestMethod http://127.0.0.1:5003/api/status | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $ok) { Write-Error 'service never came up'; exit 1 }
          python tests/smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
